metadata:
  name: pth-facebookresearch-sam3
  namespace: cvat
  annotations:
    name: Segment Anything 3
    version: 1
    type: interactor
    spec:
    min_pos_points: 0
    min_neg_points: 0
    startswith_box_optional: true
    animated_gif: https://raw.githubusercontent.com/cvat-ai/cvat/develop/site/content/en/images/hrnet_example.gif
    help_message: The interactor allows to get a mask of an object using text prompts, points, or boxes. SAM 3 supports open-vocabulary concept segmentation.

spec:
  description: Interactive object segmentation with Segment-Anything 3 (SAM 3)
  runtime: 'python:3.12'
  handler: main:handler
  eventTimeout: 60s
  env:
    - name: PYTHONPATH
      value: /opt/nuclio/sam3
    - name: HF_HOME
      value: /opt/nuclio/sam3/hf_cache

  build:
    image: cvat.pth.facebookresearch.sam3
    baseImage: ubuntu:24.04

    directives:
      preCopy:
      # disable interactive frontend
        - kind: ENV
          value: DEBIAN_FRONTEND=noninteractive
      # set workdir
        - kind: WORKDIR
          value: /opt/nuclio/sam3
      # install basic deps
        - kind: RUN
          value: apt-get update && apt-get -y install curl git python3 python3-pip python3-venv ffmpeg libsm6 libxext6
      # create and activate virtual environment
        - kind: RUN
          value: python3 -m venv /opt/venv
        - kind: ENV
          value: PATH="/opt/venv/bin:$PATH"
      # install PyTorch with CUDA 12.6 support (required for SAM 3)
        - kind: RUN
          value: pip install torch==2.7.0 torchvision torchaudio --index-url https://download.pytorch.org/whl/cu126
      # install SAM 3 from GitHub
        - kind: RUN
          value: pip install git+https://github.com/facebookresearch/sam3.git
      # install additional dependencies
        - kind: RUN
          value: pip install pycocotools matplotlib Pillow huggingface_hub
      # create cache directory for Hugging Face models
        - kind: RUN
          value: mkdir -p /opt/nuclio/sam3/hf_cache
      # Note: SAM 3 checkpoints require Hugging Face authentication
      # You need to: 1) Request access at https://huggingface.co/facebook/sam3
      #              2) Set HF_TOKEN environment variable or run `huggingface-cli login`

  triggers:
    myHttpTrigger:
      numWorkers: 2
      kind: 'http'
      workerAvailabilityTimeoutMilliseconds: 15000
      attributes:
        maxRequestBodySize: 33554432 # 32MB

  platform:
    attributes:
      restartPolicy:
        name: always
        maximumRetryCount: 3
      mountMode: volume
